# chronos nginx site — TLS termination + reverse proxy to Kestrel.
# Install: /etc/nginx/sites-available/chronos → symlink sites-enabled.
# Replace app.example.com and certificate paths before enabling.
#
# Security headers target Snyk website security score / securityheaders.com:
# Strict-Transport-Security, Content-Security-Policy, X-Frame-Options,
# X-Content-Type-Options, X-XSS-Protection, Referrer-Policy, Permissions-Policy.
# All use "always" so error and proxied responses still carry them.
# Do not add conflicting add_header directives inside location blocks
# (nginx drops inherited add_header when a location defines its own).

upstream chronos_kestrel {
    server 127.0.0.1:5001;
    keepalive 32;
}

# Redirect HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name app.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.example.com;

    ssl_certificate     /etc/letsencrypt/live/app.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.example.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Hide nginx version
    server_tokens off;

    # --- Snyk / securityheaders.com security headers ---
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
    # Tune CSP if you add CDNs, OAuth popups, or external APIs.
    # Fluent UI / Vite often need style-src 'unsafe-inline'; script-src stays 'self' for published assets.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; upgrade-insecure-requests" always;

    client_max_body_size 25m;

    location / {
        proxy_pass http://chronos_kestrel;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
