name: CI

on:
  push:
    branches: [main, modular]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-architecture:
    name: Backend architecture tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore & test architecture suite
        run: dotnet test Tests/CarTrack.ArchitectureTests/CarTrack.ArchitectureTests.csproj --nologo --verbosity minimal

  frontend-boundaries:
    name: Frontend boundaries + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint module boundaries (ADR 0001)
        run: npm run lint:boundaries

      - name: Production build
        run: npm run build
